name: Test shell

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
    inputs:
      enable_terminal:
        type: boolean
        description: 'Enable terminal session.'
        required: false
        default: false

env:
  BATS_LIB_PATH: "./node_modules"
  # Oldest supported version, kept in sync with the "bats" range in package.json.
  BATS_VERSION_LOWEST: "1.13.0"

jobs:
  test-shell:
    name: ${{ matrix.os }}, Deps ${{ matrix.deps }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-14
          - macos-15
        deps:
          - normal
          - lowest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install current Bash on macOS
        if: startsWith(matrix.os, 'macos-')
        run: brew install bash

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup sh-checker
        uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
        if: matrix.os == 'ubuntu-latest' && matrix.deps == 'normal'
        env:
          SHFMT_OPTS: -i 2 -ci -s -d

      - name: Install dependencies
        if: matrix.deps == 'normal'
        run: npm install

      - name: Install lowest dependencies
        if: matrix.deps == 'lowest'
        run: npm install --no-save "bats@${BATS_VERSION_LOWEST}"

      - name: Install Kcov
        if: matrix.os == 'ubuntu-latest' && matrix.deps == 'normal'
        run: |
          KCOV_VERSION=v43 && \
          sudo apt update && \
          sudo apt install -y git cmake g++ libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev binutils-dev && \
          git clone https://github.com/SimonKagstrom/kcov.git && \
          cd kcov && git checkout ${KCOV_VERSION} && mkdir build && cd build && \
          cmake .. && make && sudo make install && \
          kcov --version

      - name: Config Git user for tests.
        run: git config --global user.name "Test user" && git config --global user.email "someone@example.com"

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.deps == 'normal'
        run: kcov --clean --include-pattern=.bash --bash-parse-files-in-dir=. --exclude-path=node_modules,vendor,coverage "$(pwd)"/coverage ./node_modules/.bin/bats tests
        shell: bash

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.deps == 'normal'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.deps != 'normal'
        run: ./node_modules/.bin/bats tests
        shell: bash

      - name: Setup tmate session
        if: ${{ !cancelled() && github.event.inputs.enable_terminal }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 20
